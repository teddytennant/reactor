[package]
name = "reactor-sink"
version = "0.1.0"
edition = "2021"
description = "Reactor contained egress sink — nothing egresses past here."

[[bin]]
name = "reactor-sink"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
