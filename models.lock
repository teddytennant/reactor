# models.lock — pinned weights and endpoints (SPEC §5.1)
#
# Revision SHAs are filled in by `make lock` the moment a weights download
# succeeds inside the chamber image build; until then they read UNPINNED and
# the engine stamps `revision: "unpinned"` on every DetonationReport so a
# report can never imply reproducibility it does not have.

[victim]
# The only model that ever reads attacker-controlled text.
id             = "Qwen/Qwen3.6-27B-FP8"
revision       = "UNPINNED"
served         = "sglang"
tool_call_parser = "qwen3_coder"
reasoning_parser = "qwen3"
context_length = 32768
temperature    = 0.0
seed           = 7
tp_size        = 1
mem_fraction_static = 0.85
endpoint       = "http://127.0.0.1:8000/v1"

[victim.sim]
# No-GPU stand-in. Deterministic, tool-calling, gullible by construction.
# Every report produced with this backend carries victim.simulated = true and
# the UI prints SIMULATED VICTIM. It is a harness, never a result.
id       = "reactor/sim-victim-v1"
revision = "builtin"
served   = "sim"

[redteam]
# Offline artifact authoring only. Never loaded on the demo sandbox (SPEC §5.3).
id       = "huihui-ai/Huihui-Qwen3.6-27B-abliterated"
revision = "UNPINNED"
served   = "sglang"
enabled  = false

[analyst]
# Outside the chamber. Reads typed events only, never artifact prose.
id       = "grok-4.5"
base_url = "https://api.x.ai/v1"
api_key_env = "XAI_API_KEY"
temperature = 0.0

[analyst.fallback]
# Used when XAI_API_KEY is absent: the deterministic oracle-only reasoner.
# Verdicts carry fallback = true.
id = "reactor/deterministic-analyst-v1"

[static_baseline]
# Prior art, verified 2026-07-24: PyPI `mcp-scan` is now a redirect package for
# `snyk-agent-scan` ("Agent supply chain security scanner"), which is the
# ex-Invariant Labs tool Snyk acquired. This is the left column of the demo.
package  = "snyk-agent-scan"
version  = "0.5.15"
alias    = "mcp-scan"
run      = "uvx --from snyk-agent-scan mcp-scan"
